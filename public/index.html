<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3b2c">
<title>Shan Kirana Shop | Today’s prices</title>
<style>
:root{--board:#1d3b2c;--board2:#2a5640;--chalk:#f4f1e6;--paper:#faf8f1;--card:#fff;--ink:#1c2420;--mute:#6b746d;--saffron:#e59a00;--chili:#b3261e;--line:#e3e0d2;--tile:#f3efe0;--shadow:0 2px 10px rgba(29,59,44,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#121814;--card:#1a221d;--ink:#ece9dc;--mute:#9aa49c;--line:#2d3830;--tile:#243029;--chili:#ff7b72;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Telugu",sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}

/* hero */
.hero{background:radial-gradient(circle at 85% 0,var(--board2),var(--board) 60%);color:var(--chalk);padding:calc(26px + env(safe-area-inset-top,0px)) 0 26px;border-bottom:6px solid var(--saffron)}
.hero .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hero h1{margin:0;font:800 clamp(2rem,7vw,3.3rem)/1 Georgia,"Times New Roman",serif;letter-spacing:-.02em}
.hero p{margin:8px 0 0;opacity:.88;max-width:34ch}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:99px;font-size:.88rem;color:var(--chalk);text-decoration:none;white-space:nowrap}
a.badge:hover{background:rgba(255,255,255,.22)}

/* toolbar */
.tools{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 0 8px}
.row1{display:flex;gap:8px;flex-wrap:wrap}
.search{position:relative;flex:1 1 220px}
.search input{width:100%;min-height:46px;padding:10px 40px 10px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.search .ic{position:absolute;left:13px;top:11px;opacity:.55;pointer-events:none}
.search .x{position:absolute;right:6px;top:5px;width:36px;height:36px;border:0;background:none;font-size:1.2rem;color:var(--mute);display:none}
.search.has .x{display:block}
select{min-height:46px;padding:0 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;width:46px;min-height:43px;font-size:1.1rem}
.seg button[aria-pressed=true]{background:var(--board);color:var(--chalk)}
.tog{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);white-space:nowrap;user-select:none}
.tog input{width:18px;height:18px;accent-color:var(--board)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;min-height:40px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--board);border-color:var(--board);color:var(--chalk)}
.chip small{opacity:.65}
.meta{color:var(--mute);font-size:.9rem;padding:14px 0 0}

/* items */
h2.cat{margin:26px 0 10px;font:700 1.3rem Georgia,serif;display:flex;align-items:center;gap:8px}
h2.cat small{font:400 .85rem system-ui;color:var(--mute)}
.items{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--saffron)}
.card.in{border-color:var(--board);box-shadow:0 0 0 2px var(--board) inset}
.tile{width:52px;height:52px;border-radius:14px;background:var(--tile);display:grid;place-items:center;font-size:1.7rem}
.nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.un{color:var(--mute);font-size:.88rem}
.pr{font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.act{margin-top:auto;padding-top:8px}
.add{width:100%;min-height:44px;border:1.5px solid var(--board);background:transparent;border-radius:10px;font-weight:700}
.add:hover,.add:active{background:var(--board);color:var(--chalk)}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--board);color:var(--chalk);border-radius:10px;padding:3px}
.qty button{width:42px;height:38px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:inherit;font-weight:800;font-size:1.1rem}
.qty b{min-width:30px;text-align:center}
.out{opacity:.6}
.out .act{color:var(--chili);font-weight:700;min-height:44px;display:flex;align-items:center}
.list .items{grid-template-columns:1fr}
.list .card{flex-direction:row;align-items:center;gap:12px;padding:10px 12px}
.list .tile{width:44px;height:44px;font-size:1.4rem;flex:none}
.list .info{flex:1;min-width:0}
.list .act{margin:0;padding:0;width:128px;flex:none}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.empty b{display:block;font-size:2rem}
.skel{height:150px;border-radius:16px;background:linear-gradient(90deg,var(--tile),var(--card),var(--tile));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* cart bar */
.bar{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:var(--board);color:var(--chalk);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .25s;z-index:30;border:0;text-align:left}
.bar.on{transform:translateX(-50%) translateY(0)}
.bar .t{flex:1;line-height:1.25}.bar .t small{display:block;opacity:.8}
.bar .go{background:var(--saffron);color:#1c1400;font-weight:800;border-radius:10px;padding:11px 16px}

/* drawer */
dialog{border:0;padding:0;max-width:100%;background:var(--paper);color:var(--ink);width:min(480px,100%);max-height:92dvh;margin:auto 0 0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.5)}
@media (min-width:700px){dialog{margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:0}}
.dwrap{display:flex;flex-direction:column;max-height:inherit;height:100%}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--board);color:var(--chalk)}
.dh h3{margin:0;font:700 1.25rem Georgia,serif}
.dh button{background:none;border:0;color:inherit;font-size:1.6rem;width:44px;height:44px}
.db{padding:6px 16px 16px;overflow:auto;flex:1}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ln .i{flex:1;min-width:0}.ln .i small{display:block;color:var(--mute)}
.ln .qty{background:var(--tile);color:var(--ink)}.ln .qty button{background:var(--card);border:1px solid var(--line)}
.ln .sum{min-width:62px;text-align:right;font-weight:700}
.f{display:grid;gap:8px;margin-top:14px}
.f input,.f textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);min-height:46px}
.f textarea{min-height:64px;resize:vertical}
.df{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.tot{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;margin-bottom:10px}
.send{width:100%;min-height:50px;border:0;border-radius:12px;background:#25a244;color:#fff;font-weight:800;font-size:1.05rem}
.send:disabled{opacity:.5}
.link{background:none;border:0;color:var(--chili);padding:10px 0;font-weight:600}
.note{color:var(--mute);font-size:.85rem;margin:8px 0 0}
footer{text-align:center;color:var(--mute);font-size:.9rem;padding:30px 16px}

@media (max-width:520px){
  .seg button{width:42px}
  .list .act{width:112px}
  .items{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{padding:12px}
  .list .items{grid-template-columns:1fr}
}
@media (max-width:359px){.items{grid-template-columns:1fr}}
@media (min-width:900px){.items{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.tools,.bar{display:none}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div>
    <h1>Shan Kirana Shop</h1>
    <p>Fresh daily prices. Pick your items and send your order on WhatsApp.</p>
  </div>
  <div class="badges">
    <span class="badge">🛒 Easy ordering</span>
    <span class="badge">💰 Live prices</span>
    <a class="badge" id="call" href="#" hidden>📞 Call shop</a>
  </div>
</div></header>

<div class="tools"><div class="wrap">
  <div class="row1">
    <div class="search" id="sbox">
      <span class="ic">🔍</span>
      <input type="search" id="q" placeholder="Search items, for example dal or oil" aria-label="Search items" autocomplete="off">
      <button class="x" id="clr" aria-label="Clear search">×</button>
    </div>
    <select id="sort" aria-label="Sort items">
      <option value="def">Sort: Default</option>
      <option value="lo">Price: low to high</option>
      <option value="hi">Price: high to low</option>
      <option value="az">Name: A to Z</option>
    </select>
    <label class="tog"><input type="checkbox" id="stock"> <span>In stock only</span></label>
    <div class="seg" role="group" aria-label="View">
      <button id="vg" aria-pressed="true" aria-label="Grid view" title="Grid">▦</button>
      <button id="vl" aria-pressed="false" aria-label="List view" title="List">☰</button>
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
</div></div>

<main class="wrap" id="main" aria-live="polite">
  <div class="meta" id="meta"></div>
  <div id="list"><div class="items"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
</main>
<footer>Prices can change during the day. The shop confirms the final bill.</footer>

<button class="bar" id="bar" aria-label="View your order">
  <span class="t"><b id="count"></b><small id="total"></small></span>
  <span class="go">View order →</span>
</button>

<dialog id="dlg" aria-labelledby="dt"><div class="dwrap">
  <div class="dh"><h3 id="dt">Your order</h3><button id="close" aria-label="Close">×</button></div>
  <div class="db">
    <div id="lines"></div>
    <button class="link" id="clear">Clear all items</button>
    <div class="f">
      <input id="cn" placeholder="Your name (optional)" autocomplete="name">
      <textarea id="ca" placeholder="Delivery address or “I will pick up” (optional)" autocomplete="street-address"></textarea>
      <input id="cm" placeholder="Note for the shop (optional)">
    </div>
    <p class="note">The shop will confirm the final bill on WhatsApp.</p>
  </div>
  <div class="df">
    <div class="tot"><span>Total</span><span id="dtotal"></span></div>
    <button class="send" id="send">Send order on WhatsApp</button>
  </div>
</div></dialog>

<script>
const $ = (s) => document.querySelector(s);
const rs = (n) => '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('sk_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sk_' + k, JSON.stringify(v)); } catch {} }
};
let items = [], phone = '', loaded = false;
let cart = store.get('cart', {}), cat = 'All', q = '', sort = store.get('sort', 'def'), stockOnly = store.get('stock', false), view = store.get('view', 'grid');

const ICONS = [[/rice|atta|wheat|flour/i, '🌾'], [/dal|pulse|gram/i, '🫘'], [/oil|ghee/i, '🛢️'], [/stapl|sugar|salt/i, '🧂'], [/masala|spice/i, '🌶️'], [/bever|tea|coffee/i, '☕'], [/house|soap|deterg|clean/i, '🧼'], [/snack|biscuit|noodle/i, '🍪'], [/milk|dairy/i, '🥛'], [/veg|fruit/i, '🥬']];
const icon = (c, n) => { for (const [r, i] of ICONS) if (r.test(c) || r.test(n)) return i; return '🛍️'; };

async function load() {
  try {
    const [i, s] = await Promise.all([fetch('/api/items').then((r) => r.json()), fetch('/api/shop').then((r) => r.json())]);
    items = Array.isArray(i) ? i : []; phone = String(s.phone || '').replace(/\D/g, ''); loaded = true;
  } catch (e) { if (!loaded) $('#list').replaceChildren(el('div', 'empty', 'Could not load prices. Check your internet and refresh.')); return; }
  const ids = new Set(items.map((x) => x.id));
  Object.keys(cart).forEach((k) => { if (!ids.has(+k)) delete cart[k]; });
  const call = $('#call'); if (phone) { call.href = 'tel:+' + phone; call.hidden = false; }
  render();
}

function visible() {
  let r = items.filter((x) => (cat === 'All' || x.category === cat) && x.name.toLowerCase().includes(q) && (!stockOnly || x.in_stock));
  if (sort === 'lo') r.sort((a, b) => a.price - b.price);
  else if (sort === 'hi') r.sort((a, b) => b.price - a.price);
  else if (sort === 'az') r.sort((a, b) => a.name.localeCompare(b.name));
  return r;
}

function actionFor(x) {
  const a = el('div', 'act');
  if (!x.in_stock) { a.textContent = 'Out of stock'; return a; }
  if (!cart[x.id]) { const b = el('button', 'add', 'Add'); b.onclick = () => setQty(x.id, 1); a.append(b); return a; }
  const w = el('div', 'qty'), m = el('button', null, '−'), p = el('button', null, '+');
  m.setAttribute('aria-label', 'Remove one ' + x.name); p.setAttribute('aria-label', 'Add one ' + x.name);
  m.onclick = () => setQty(x.id, -1); p.onclick = () => setQty(x.id, 1);
  w.append(m, el('b', null, cart[x.id]), p); a.append(w); return a;
}

function card(x) {
  const c = el('div', 'card' + (x.in_stock ? '' : ' out') + (cart[x.id] && x.in_stock ? ' in' : ''));
  const info = el('div', 'info');
  info.append(el('div', 'nm', x.name), el('div', 'un', x.unit), el('div', 'pr', rs(x.price)));
  c.append(el('div', 'tile', icon(x.category, x.name)), info, actionFor(x));
  return c;
}

function render() {
  const counts = {}; items.forEach((x) => { counts[x.category] = (counts[x.category] || 0) + 1; });
  const cats = ['All', ...Object.keys(counts)];
  if (!cats.includes(cat)) cat = 'All';
  const chips = $('#chips'); chips.replaceChildren();
  cats.forEach((c) => {
    const b = el('button', 'chip'); b.append(c === 'All' ? '✨ All' : icon(c, '') + ' ' + c); b.append(el('small', null, c === 'All' ? items.length : counts[c]));
    b.setAttribute('aria-pressed', c === cat); b.onclick = () => { cat = c; render(); }; chips.append(b);
  });
  document.body.classList.toggle('list', view === 'list');
  $('#vg').setAttribute('aria-pressed', view === 'grid'); $('#vl').setAttribute('aria-pressed', view === 'list');

  const shown = visible(), list = $('#list'); list.replaceChildren();
  $('#meta').textContent = items.length ? shown.length + (shown.length === 1 ? ' item' : ' items') : '';
  if (!shown.length) {
    const e = el('div', 'empty'); e.append(el('b', null, '🔎'), items.length ? 'No items match your search.' : 'The shop has not added items yet.');
    list.append(e);
  } else if (sort === 'def') {
    const groups = new Map(); shown.forEach((x) => { if (!groups.has(x.category)) groups.set(x.category, []); groups.get(x.category).push(x); });
    groups.forEach((arr, c) => {
      const h = el('h2', 'cat', icon(c, '') + ' ' + c); h.append(el('small', null, arr.length));
      const g = el('div', 'items'); arr.forEach((x) => g.append(card(x))); list.append(h, g);
    });
  } else { const g = el('div', 'items'); g.style.marginTop = '14px'; shown.forEach((x) => g.append(card(x))); list.append(g); }
  summary();
}

function setQty(id, d) { cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; store.set('cart', cart); render(); }
const lines = () => items.filter((x) => cart[x.id] && x.in_stock).map((x) => ({ x, n: cart[x.id] }));
const totals = () => { const ls = lines(); return { ls, n: ls.reduce((s, l) => s + l.n, 0), t: ls.reduce((s, l) => s + l.x.price * l.n, 0) }; };

function summary() {
  const { n, t } = totals();
  $('#bar').classList.toggle('on', n > 0);
  $('#count').textContent = n + (n === 1 ? ' item' : ' items') + ' in your order';
  $('#total').textContent = 'Total ' + rs(t);
  if ($('#dlg').open) { if (!n) $('#dlg').close(); else drawer(); }
}

function drawer() {
  const { ls, t } = totals(), box = $('#lines'); box.replaceChildren();
  ls.forEach(({ x, n }) => {
    const r = el('div', 'ln'), i = el('div', 'i'); i.append(el('b', null, x.name), el('small', null, x.unit + ' · ' + rs(x.price)));
    const w = el('div', 'qty'), m = el('button', null, '−'), p = el('button', null, '+');
    m.setAttribute('aria-label', 'Remove one ' + x.name); p.setAttribute('aria-label', 'Add one ' + x.name);
    m.onclick = () => setQty(x.id, -1); p.onclick = () => setQty(x.id, 1); w.append(m, el('b', null, n), p);
    r.append(i, w, el('div', 'sum', rs(x.price * n))); box.append(r);
  });
  $('#dtotal').textContent = rs(t); $('#send').disabled = !ls.length;
}

$('#bar').onclick = () => { drawer(); $('#dlg').showModal(); };
$('#close').onclick = () => $('#dlg').close();
$('#dlg').addEventListener('click', (e) => { if (e.target === $('#dlg')) $('#dlg').close(); });
$('#clear').onclick = () => { if (confirm('Remove all items from your order?')) { cart = {}; store.set('cart', cart); render(); } };
['cn', 'ca', 'cm'].forEach((id) => { const f = $('#' + id); f.value = store.get(id, ''); f.addEventListener('input', () => store.set(id, f.value)); });

$('#q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); $('#sbox').classList.toggle('has', !!e.target.value); render(); });
$('#clr').onclick = () => { $('#q').value = ''; q = ''; $('#sbox').classList.remove('has'); $('#q').focus(); render(); };
$('#sort').value = sort; $('#sort').onchange = (e) => { sort = e.target.value; store.set('sort', sort); render(); };
$('#stock').checked = stockOnly; $('#stock').onchange = (e) => { stockOnly = e.target.checked; store.set('stock', stockOnly); render(); };
$('#vg').onclick = () => { view = 'grid'; store.set('view', view); render(); };
$('#vl').onclick = () => { view = 'list'; store.set('view', view); render(); };

$('#send').onclick = () => {
  const { ls, t } = totals(); if (!ls.length) return;
  const name = $('#cn').value.trim(), addr = $('#ca').value.trim(), note = $('#cm').value.trim();
  const text = 'Order for Shan Kirana Shop\n' + (name ? 'Name: ' + name + '\n' : '') + (addr ? 'Address: ' + addr + '\n' : '') + '\n' +
    ls.map((l, i) => `${i + 1}. ${l.x.name} (${l.x.unit}) x ${l.n} = ${rs(l.x.price * l.n)}`).join('\n') + `\n\nTotal: ${rs(t)}` + (note ? '\nNote: ' + note : '');
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(load, 60000);
load();
</script>
</body>
</html>
